<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG AI Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Apply theme + background before first paint to prevent flash of white
      (function() {
        var theme = localStorage.getItem("mtg-theme");
        if (!theme) {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
        // Set background immediately and suppress transitions until first paint
        var bg = theme === "dark" ? "#1e1e2e" : "#eff1f5";
        var color = theme === "dark" ? "#cdd6f4" : "#4c4f69";
        document.body.style.cssText = "background-color:" + bg + ";color:" + color + ";transition:none !important";
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            document.body.style.removeProperty("transition");
          });
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
