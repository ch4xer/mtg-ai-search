services:
  mtg-db:
    image: pgvector/pgvector:pg17
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mtg
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg"]
      interval: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
    shm_size: 1G

  mtg-backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      mtg-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mtg:${POSTGRES_PASSWORD}@mtg-db:5432/mtg
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_CHAT_MODEL: ${SILICONFLOW_CHAT_MODEL:-Pro/moonshotai/Kimi-K2.5}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "4.0"

  mtg-frontend:
    build: ./frontend
    ports:
      - "60010:80"
    depends_on:
      - mtg-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  pgdata:
