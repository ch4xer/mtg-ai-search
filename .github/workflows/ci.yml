name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend import smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen
      - name: Import all backend modules
        env:
          DEEPSEEK_API_KEY: ci-placeholder
          SILICONFLOW_API_KEY: ci-placeholder
          JWT_SECRET: ci-placeholder
        run: |
          uv run python -c "
          import importlib, pkgutil
          import app
          failed = []
          for mod in pkgutil.walk_packages(app.__path__, prefix='app.'):
              try:
                  importlib.import_module(mod.name)
              except Exception as e:
                  failed.append((mod.name, repr(e)))
          if failed:
              for name, err in failed:
                  print(f'{name}: {err}')
              raise SystemExit(1)
          print('all imports ok')
          "
