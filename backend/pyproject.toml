[project]
name = "backend"
version = "0.1.0"
description = "AI-powered MTG card search backend"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.0",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "langchain>=1.2.13",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.3",
    "psycopg[binary]>=3.3.3",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.3.0",
    "requests>=2.33.0",
    "uvicorn[standard]>=0.42.0",
]
