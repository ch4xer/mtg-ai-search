services:
  mtg-db:
    image: pgvector/pgvector:pg17
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mtg
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg"]
      interval: 5s
      retries: 5

  mtg-backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      mtg-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mtg:${POSTGRES_PASSWORD}@mtg-db:5432/mtg
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      JWT_SECRET: ${JWT_SECRET}

  mtg-frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - mtg-backend

volumes:
  pgdata:
